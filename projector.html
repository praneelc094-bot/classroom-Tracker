<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Classroom Tracker – Projector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0F0E; color: #fff; font-family: 'Hanken Grotesk', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
    #stage { height: 100%; display: flex; flex-direction: column; }
    #head { padding: 4.4vh 3.9vw 2vh; display: flex; align-items: baseline; gap: 18px; }
    #label { font: 500 12px 'JetBrains Mono', monospace; color: #7FB592; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
    #topic { font-family: 'Instrument Serif', Georgia, serif; font-size: 5.4vh; line-height: 1; }
    #frame { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 3.9vw; min-height: 0; }
    #img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; border-radius: 8px; opacity: 0; transition: opacity .5s ease; }
    #img.visible { opacity: 1; }
    #caption { padding: 1.7vh 3.9vw 3.2vh; font-size: 13px; color: #7C807D; min-height: 2vh; }
    #waiting { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .logo { width: 56px; height: 56px; border-radius: 14px; background: #1A5C3A; display: flex; align-items: center; justify-content: center; font: italic 30px 'Instrument Serif', Georgia, serif; }
    #waiting span { font-size: 24px; color: #8A8F8B; text-align: center; }
    body:not(.showing) #head, body:not(.showing) #caption { visibility: hidden; }
    #hint { position: fixed; top: 14px; right: 18px; font-size: 13px; color: #5A5E5B; transition: opacity 1s; }
    #hint b { color: #8A8F8B; }
    body:fullscreen #hint, body.fs #hint { opacity: 0; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="head"><span id="label">Now teaching</span><span id="topic"></span></div>
    <div id="frame">
      <img id="img" alt="">
      <div id="waiting"><div class="logo">Ct</div><span>Waiting for the teacher to approve an image…</span></div>
    </div>
    <div id="caption"></div>
  </div>
  <div id="hint">Drag this window to the projector, then press <b>F</b> or double-click for fullscreen</div>

  <script>
    // Receives approved images from the teacher page (index.html) – same computer, same browser
    const channel = new BroadcastChannel('classroom-tracker');
    const img = document.getElementById('img');

    function show(msg) {
      document.getElementById('waiting').style.display = 'none';
      img.classList.remove('visible');
      const next = new Image();
      next.onload = () => {                         // swap only once the new image has loaded
        img.src = next.src;
        img.style.display = 'block';
        requestAnimationFrame(() => img.classList.add('visible'));
        document.body.classList.add('showing');
        document.getElementById('topic').textContent = msg.topic;
        const i = msg.image;
        document.getElementById('caption').textContent =
          `${i.title}${i.artist ? ' – ' + i.artist : ''}${i.license ? ' · ' + i.license : ''} · Wikimedia Commons`;
      };
      next.src = msg.image.src;
    }

    function clear() {
      img.classList.remove('visible');
      img.style.display = 'none';
      document.body.classList.remove('showing');
      document.getElementById('topic').textContent = '';
      document.getElementById('caption').textContent = '';
      document.getElementById('waiting').style.display = 'flex';
    }

    channel.onmessage = (e) => {
      if (e.data?.type === 'show') show(e.data);
      if (e.data?.type === 'clear') clear();
    };

    // Tell the teacher page we're here (it replies with the current image), and keep saying so
    const hello = () => channel.postMessage({ type: 'hello' });
    hello();
    setInterval(hello, 3000);

    function toggleFullscreen() {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
    document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f') toggleFullscreen(); });
    document.addEventListener('dblclick', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
  </script>
</body>
</html>
